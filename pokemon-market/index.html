<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ポケカ仕入れ判定</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=21">
</head>
<body>
  <header class="app-header">
    <h1>ポケカ仕入れ判定</h1>
  </header>

  <main class="app-main">
    <section class="search-section" aria-labelledby="searchTitle">
      <h2 id="searchTitle" class="visually-hidden">カード検索</h2>
      <form id="searchForm" class="search-form" role="search">
        <label class="visually-hidden" for="searchInput">カード名またはカード番号</label>
        <div class="search-row">
          <div class="search-field">
            <input
              id="searchInput"
              class="search-input"
              type="search"
              enterkeyhint="search"
              autocomplete="off"
              placeholder="カード名・番号 例: ピカチュウ 025"
            >
            <button id="clearSearch" class="clear-search" type="button" aria-label="検索語を消す" title="検索語を消す" hidden>×</button>
          </div>
          <button class="search-button" type="submit">検索</button>
        </div>
      </form>

      <div class="result-toolbar">
        <p id="searchStatus" class="search-status" role="status">カードを検索してください</p>
        <div id="rarityFilters" class="rarity-filters" role="group" aria-label="レアリティで絞り込む" hidden></div>
      </div>

      <section id="selectionPanel" class="selection-panel" aria-label="選択したカード" hidden>
        <article class="selected-card">
          <div id="selectedCardSummary" class="selected-card-summary"></div>
          <button id="chooseAnother" class="choose-another" type="button">選び直す</button>

          <div class="store-price-row">
            <label for="purchasePriceInput">仕入れ金額</label>
            <div class="store-price-input">
              <span aria-hidden="true">円</span>
              <input id="purchasePriceInput" type="number" min="0" step="1" inputmode="numeric" placeholder="500">
            </div>
          </div>

          <div id="selectedProfit" class="profit-strip" aria-label="種類別利益" aria-live="polite"></div>
          <div id="selectedMarket" class="card-calculator"></div>
        </article>
      </section>

      <div id="cardList" class="card-list" aria-live="polite"></div>
    </section>

    <details class="calculator-settings">
      <summary>計算設定</summary>
      <div class="settings-grid">
        <label>eBay手数料 (%)<input id="feeRateInput" type="number" min="0" max="100" step="0.1"></label>
        <label>海外送料 (円)<input id="internationalShippingInput" type="number" min="0" step="1"></label>
        <label>梱包費 (円)<input id="packingCostInput" type="number" min="0" step="1"></label>
        <label>為替余裕率 (%)<input id="fxBufferRateInput" type="number" min="0" max="100" step="0.1"></label>
        <label>目標利益 (円)<input id="targetProfitInput" type="number" min="0" step="1"></label>
        <label>目標ROI (%)<input id="targetRoiInput" type="number" min="0" step="1"></label>
      </div>
    </details>
  </main>

  <footer class="app-footer">
    <p id="fxStatus" role="status">為替レートを取得中</p>
  </footer>

  <div id="notification" class="notification" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js?v=21"></script>
</body>
</html>
